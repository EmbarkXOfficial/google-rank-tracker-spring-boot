# Demo profile: sample history (not real rankings), so the arrows, alerts and chart have something to show.
# Run with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo

# Separate in-memory database, filled from demo-data.sql on every start. Your real data in ./data is untouched.
spring.datasource.url=jdbc:h2:mem:rank-tracker-demo
spring.sql.init.data-locations=classpath:demo-data.sql

# No daily schedule. Every demo keyword already has a row for today, so startup makes no SearchApi calls.
tracker.check-cron=-
